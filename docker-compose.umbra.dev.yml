services:
  postgres:
    image: postgres:16-alpine
    container_name: umbra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-umbra}
      POSTGRES_USER: ${POSTGRES_USER:-umbra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-umbra_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - umbra_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: umbra-api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      NODE_ENV: development
      API_PORT: ${API_PORT:-4000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://umbra:umbra_dev_password@postgres:5432/umbra}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-refresh-secret}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@umbra.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-SuperAdmin123!}
    ports:
      - "4000:4000"
    volumes:
      - ./:/app
      - umbra_api_node_modules:/app/node_modules
    command: sh -c "npm install --prefix packages/shared && npm install --prefix apps/api && npm run prisma:generate --prefix apps/api && npm run prisma:migrate:deploy --prefix apps/api && npm run prisma:seed --prefix apps/api && npm run dev --prefix apps/api"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: umbra-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_PROXY: http://api:4000
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - umbra_web_node_modules:/app/node_modules
    command: sh -c "npm install --prefix packages/shared && npm install --prefix apps/web && npm run dev --prefix apps/web"

volumes:
  umbra_postgres_data:
  umbra_api_node_modules:
  umbra_web_node_modules:
