name: Deploy Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            chmod +x deploy/ubuntu/deploy.sh
            ./deploy/ubuntu/deploy.sh "${{ secrets.DEPLOY_PATH }}" main deploy/ubuntu/.env.server docker-compose.prod.yml
