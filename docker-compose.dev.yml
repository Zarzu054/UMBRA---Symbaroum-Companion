services:
  postgres:
    image: postgres:16-alpine
    container_name: umbra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEV_POSTGRES_DB:-umbra}
      POSTGRES_USER: ${DEV_POSTGRES_USER:-umbra}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-umbra_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - umbra_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: umbra-api
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      NODE_ENV: development
      API_PORT: ${API_PORT:-4000}
      # Always use the Compose service name from inside the API container.
      # A host-side DATABASE_URL commonly points at localhost:${POSTGRES_PORT},
      # which is unreachable from this container.
      DATABASE_URL: postgresql://${DEV_POSTGRES_USER:-umbra}:${DEV_POSTGRES_PASSWORD:-umbra_dev_password}@postgres:5432/${DEV_POSTGRES_DB:-umbra}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-this-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-this-refresh-secret}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@umbra.local}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-SuperAdmin123!}
    ports:
      - "4000:4000"
    volumes:
      - ./:/app
      - umbra_api_node_modules:/app/node_modules
      - umbra_api_workspace_node_modules:/app/apps/api/node_modules
      - umbra_shared_node_modules:/app/packages/shared/node_modules
    command: sh -c "npm install --prefix packages/shared && npm install --prefix apps/api && npm run prisma:generate --prefix apps/api && npm run prisma:migrate:deploy --prefix apps/api && npm run prisma:seed --prefix apps/api && npm run dev --prefix apps/api"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: umbra-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_PROXY: http://api:4000
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - umbra_web_node_modules:/app/node_modules
      - umbra_web_workspace_node_modules:/app/apps/web/node_modules
      - umbra_shared_node_modules:/app/packages/shared/node_modules
    command: sh -c "npm install --prefix packages/shared && npm install --prefix apps/web && npm run dev --prefix apps/web"

volumes:
  umbra_postgres_data:
  umbra_api_node_modules:
  umbra_web_node_modules:
  umbra_api_workspace_node_modules:
  umbra_web_workspace_node_modules:
  umbra_shared_node_modules:
